version: "3.9"

services:
  app:
    #build: .
    image: jeanmag/video_face_recognition_arida:latest
    container_name: video_face_recognition_app
    depends_on:
      - milvus-etcd
      - milvus-minio
      - milvus-standalone
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - MILVUS_COLLECTION=rostos_embeddings
    ports:
      - "5000:5000"
    volumes:
      - /mnt/Projeto_id_facial/PastaTeste:/rostos_dataset
      #- /home/faroldigital/reconhecimento_facial/novas_imagens:/novas_imagens
      #- /home/faroldigital/reconhecimento_facial/index:/index
      - /mnt/Projeto_id_facial/ImagensAdicionadas:/app/imagens_adicionadas

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - /mnt/Projeto_id_facial/milvus/etcd:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data
    volumes:
      - /mnt/Projeto_id_facial/milvus/data:/minio_data

  milvus-standalone:
    image: milvusdb/milvus:v2.4.4
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - /mnt/Projeto_id_facial/milvus/data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio

volumes:
  milvus_etcd:
  milvus_minio:
  milvus_data:
